name: PhoneCarPlayVideo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
targets:
  PhoneCarPlayVideo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/PhoneCarPlayVideo.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.phonecarplayvideo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
